services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vlxd-api-staging
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - vlxd-staging-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vlxd-web-staging
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - vlxd-staging-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  vlxd-staging-network:
    driver: bridge
