name: CI Tests

on:
  push:
    branches: [ dev, main, feat/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    name: Run Integration & Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run test suite
        run: |
          cd vlxd-app
          node test.js
