name: CI

on:
  push:
    branches: [dev, main, "feat/*", "fix/*", "task/*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  repo-hygiene:
    name: Repo Integrity & Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify essential repository structure and core files
        run: |
          echo "Verifying essential repository files..."
          test -f AGENTS.md || { echo "Missing AGENTS.md"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -f docs/README.md || { echo "Missing docs/README.md"; exit 1; }
          test -f docs/tasks/CURRENT.md || { echo "Missing docs/tasks/CURRENT.md"; exit 1; }
          test -f docs/tasks/MVP-BACKLOG.md || { echo "Missing docs/tasks/MVP-BACKLOG.md"; exit 1; }
          test -f package.json || { echo "Missing root package.json"; exit 1; }
          test -f pnpm-workspace.yaml || { echo "Missing pnpm-workspace.yaml"; exit 1; }
          test -f turbo.json || { echo "Missing turbo.json"; exit 1; }
          test -d apps/web || { echo "Missing apps/web directory"; exit 1; }
          test -d apps/api || { echo "Missing apps/api directory"; exit 1; }
          test -d packages/shared || { echo "Missing packages/shared directory"; exit 1; }
          test -d packages/api-client || { echo "Missing packages/api-client directory"; exit 1; }
          test -d prototype/legacy-app || { echo "Missing prototype/legacy-app directory"; exit 1; }
          echo "Repository integrity check passed successfully."

  quality-gates:
    name: Quality Gates (Format, Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Lint codebase (ESLint 9)
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

  security-scan:
    name: Security Scan (Secrets & Dependency Audit)
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret detection with Gitleaks
        run: gitleaks detect --source . --verbose --no-banner --redact

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for high/critical vulnerabilities
        run: pnpm audit --audit-level=high

  staging-smoke:
    name: Staging Container Smoke Test
    runs-on: ubuntu-latest
    needs: [quality-gates]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 for smoke testing
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and boot staging Docker Compose stack
        run: docker compose -f compose.staging.yml up -d --build --wait

      - name: Run automated smoke tests
        run: node scripts/smoke-test.mjs

      - name: Capture staging container logs on failure
        if: failure()
        run: |
          echo "=== Staging Stack Logs ==="
          docker compose -f compose.staging.yml logs

      - name: Teardown staging Docker Compose stack
        if: always()
        run: docker compose -f compose.staging.yml down --volumes --remove-orphans
