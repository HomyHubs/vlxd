name: CI

on:
  push:
    branches: [dev, main, "feat/*", "fix/*", "task/*"]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  repo-hygiene:
    name: Repo Integrity & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify essential repository structure and core files
        run: |
          echo "Verifying essential repository files..."
          test -f AGENTS.md || { echo "Missing AGENTS.md"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -f docs/README.md || { echo "Missing docs/README.md"; exit 1; }
          test -f docs/tasks/CURRENT.md || { echo "Missing docs/tasks/CURRENT.md"; exit 1; }
          test -f docs/tasks/MVP-BACKLOG.md || { echo "Missing docs/tasks/MVP-BACKLOG.md"; exit 1; }
          test -f package.json || { echo "Missing root package.json"; exit 1; }
          test -f pnpm-workspace.yaml || { echo "Missing pnpm-workspace.yaml"; exit 1; }
          test -f turbo.json || { echo "Missing turbo.json"; exit 1; }
          test -d apps/web || { echo "Missing apps/web directory"; exit 1; }
          test -d apps/api || { echo "Missing apps/api directory"; exit 1; }
          test -d packages/shared || { echo "Missing packages/shared directory"; exit 1; }
          test -d packages/api-client || { echo "Missing packages/api-client directory"; exit 1; }
          test -d prototype/legacy-app || { echo "Missing prototype/legacy-app directory"; exit 1; }
          echo "Repository integrity check passed successfully."

  quality-gates:
    name: Quality Gates (Format, Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Lint codebase (ESLint 9)
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

  security-scan:
    name: Security Scan (Secrets & Dependency Audit)
    runs-on: ubuntu-latest
    needs: [repo-hygiene]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret detection with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for high/critical vulnerabilities
        run: pnpm audit --audit-level=high
