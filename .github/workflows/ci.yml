name: CI

on:
  push:
    branches: [dev, main, "feat/*", "fix/*", "task/*"]
  pull_request:
    branches: [dev, main]

jobs:
  repo-hygiene:
    name: Repo Integrity & Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify repository structure and core files
        run: |
          echo "Verifying essential repository files..."
          test -f AGENTS.md || { echo "Missing AGENTS.md"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          test -f docs/README.md || { echo "Missing docs/README.md"; exit 1; }
          test -f docs/tasks/CURRENT.md || { echo "Missing docs/tasks/CURRENT.md"; exit 1; }
          test -f docs/tasks/MVP-BACKLOG.md || { echo "Missing docs/tasks/MVP-BACKLOG.md"; exit 1; }
          test -d prototype/legacy-app || { echo "Missing prototype/legacy-app directory"; exit 1; }
          echo "Repository integrity check passed successfully."
