name: Staging Smoke Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      smoke_max_attempts:
        description: "Maximum smoke test retry attempts"
        required: false
        default: "15"
      rollback_sha:
        description: "Full 40-character commit SHA to rollback to if needed"
        required: false
        default: ""

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-check:
    name: Pre-Deploy Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  build-and-publish-artifacts:
    name: Build & Publish Immutable Staging Images
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for image tag
        id: repo_meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Build & push API immutable candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/api:${{ github.sha }}
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/api:staging-candidate

      - name: Build & push Web immutable candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/web:${{ github.sha }}
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/web:staging-candidate

  deploy-and-verify-staging:
    name: Staging Deployment, Smoke Verification & Rollback Guard
    runs-on: ubuntu-latest
    needs: [build-and-publish-artifacts]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 for smoke testing
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for image tag
        id: repo_meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Pull exact SHA candidate artifacts from GHCR
        run: |
          REPO_LC="${{ steps.repo_meta.outputs.repo_lc }}"
          echo "Pulling API candidate image: ghcr.io/${REPO_LC}/api:${{ github.sha }}"
          docker pull "ghcr.io/${REPO_LC}/api:${{ github.sha }}"

          echo "Pulling Web candidate image: ghcr.io/${REPO_LC}/web:${{ github.sha }}"
          docker pull "ghcr.io/${REPO_LC}/web:${{ github.sha }}"

      - name: Verify Compose Image Resolution
        run: |
          REPO_LC="${{ steps.repo_meta.outputs.repo_lc }}"
          RESOLVED=$(API_IMAGE="ghcr.io/${REPO_LC}/api:${{ github.sha }}" \
                     WEB_IMAGE="ghcr.io/${REPO_LC}/web:${{ github.sha }}" \
                     docker compose -f compose.staging.yml config --images)
          echo "Resolved Compose images:"
          echo "$RESOLVED"
          echo "$RESOLVED" | grep -F "ghcr.io/${REPO_LC}/api:${{ github.sha }}" || { echo "❌ API image not resolved correctly"; exit 1; }
          echo "$RESOLVED" | grep -F "ghcr.io/${REPO_LC}/web:${{ github.sha }}" || { echo "❌ Web image not resolved correctly"; exit 1; }
          echo "✅ Compose correctly resolved candidate image tags."

      - name: Boot Staging Candidate Stack
        run: |
          REPO_LC="${{ steps.repo_meta.outputs.repo_lc }}"
          API_IMAGE="ghcr.io/${REPO_LC}/api:${{ github.sha }}" \
          WEB_IMAGE="ghcr.io/${REPO_LC}/web:${{ github.sha }}" \
          docker compose -f compose.staging.yml up -d --no-build --wait

      - name: Run Automated Post-Deploy Smoke Tests
        env:
          API_URL: "http://localhost:3001"
          WEB_URL: "http://localhost:3000"
          SMOKE_MAX_ATTEMPTS: ${{ github.event.inputs.smoke_max_attempts || '15' }}
          SMOKE_RETRY_DELAY_MS: "1500"
        run: node scripts/smoke-test.mjs

      - name: Capture Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== STAGING DEPLOYMENT FAILED: DIAGNOSTIC CONTAINER LOGS ==="
          docker compose -f compose.staging.yml logs

      - name: Execute Verified Automated Rollback on Smoke Failure
        if: failure()
        env:
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
          REPO_LC: ${{ steps.repo_meta.outputs.repo_lc }}
        run: |
          echo "⚠️ Smoke tests failed for candidate revision ${{ github.sha }}."
          echo "Initiating automated rollback to previous known-good deployment state..."

          # Validate full 40-character commit SHA format strictly
          if [[ -n "$ROLLBACK_SHA" ]]; then
            if [[ ! "$ROLLBACK_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "❌ Invalid rollback SHA format. Must be 40-character hex string: ${ROLLBACK_SHA}"
              exit 1
            fi
            echo "Rolling back to specified immutable commit SHA: ${ROLLBACK_SHA}"
            TARGET_API_IMAGE="ghcr.io/${REPO_LC}/api:${ROLLBACK_SHA}"
            TARGET_WEB_IMAGE="ghcr.io/${REPO_LC}/web:${ROLLBACK_SHA}"
          else
            echo "Rolling back to verified previous staging release (:staging)..."
            TARGET_API_IMAGE="ghcr.io/${REPO_LC}/api:staging"
            TARGET_WEB_IMAGE="ghcr.io/${REPO_LC}/web:staging"
          fi

          echo "Pulling rollback images: ${TARGET_API_IMAGE} and ${TARGET_WEB_IMAGE}"
          docker pull "$TARGET_API_IMAGE"
          docker pull "$TARGET_WEB_IMAGE"

          API_IMAGE="$TARGET_API_IMAGE" \
          WEB_IMAGE="$TARGET_WEB_IMAGE" \
          docker compose -f compose.staging.yml up -d --no-build --wait

          echo "Re-running smoke test to verify rollback health..."
          node scripts/smoke-test.mjs
          echo "✅ Rollback restoration healthy and verified."

      - name: Promote Candidate Images to Staging Release Tags
        if: success()
        run: |
          REPO_LC="${{ steps.repo_meta.outputs.repo_lc }}"
          echo "Preserving existing active staging release as :staging-previous..."
          # Step 1: Pull current :staging and retag as :staging-previous to preserve history
          if docker pull "ghcr.io/${REPO_LC}/api:staging" 2>/dev/null; then
            docker tag "ghcr.io/${REPO_LC}/api:staging" "ghcr.io/${REPO_LC}/api:staging-previous"
            docker push "ghcr.io/${REPO_LC}/api:staging-previous"
          fi
          if docker pull "ghcr.io/${REPO_LC}/web:staging" 2>/dev/null; then
            docker tag "ghcr.io/${REPO_LC}/web:staging" "ghcr.io/${REPO_LC}/web:staging-previous"
            docker push "ghcr.io/${REPO_LC}/web:staging-previous"
          fi

          echo "Promoting candidate revision ${{ github.sha }} to official :staging tag..."
          # Step 2: Promote candidate to :staging
          docker tag "ghcr.io/${REPO_LC}/api:${{ github.sha }}" "ghcr.io/${REPO_LC}/api:staging"
          docker tag "ghcr.io/${REPO_LC}/web:${{ github.sha }}" "ghcr.io/${REPO_LC}/web:staging"
          docker push "ghcr.io/${REPO_LC}/api:staging"
          docker push "ghcr.io/${REPO_LC}/web:staging"

          echo "✅ Staging promotion completed successfully. Revision ${{ github.sha }} is active."
