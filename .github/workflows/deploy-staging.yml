name: Staging Smoke Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      smoke_max_attempts:
        description: "Maximum smoke test retry attempts"
        required: false
        default: "15"
      rollback_sha:
        description: "Commit SHA to rollback to if needed"
        required: false
        default: ""

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-check:
    name: Pre-Deploy Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  build-and-publish-artifacts:
    name: Build & Publish Immutable Staging Images
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for image tag
        id: repo_meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Build & push API immutable container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/api:${{ github.sha }}
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/api:staging

      - name: Build & push Web immutable container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/web:${{ github.sha }}
            ghcr.io/${{ steps.repo_meta.outputs.repo_lc }}/web:staging

  deploy-and-verify-staging:
    name: Staging Deployment, Smoke Verification & Rollback Guard
    runs-on: ubuntu-latest
    needs: [build-and-publish-artifacts]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 for smoke testing
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for image tag
        id: repo_meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Pull immutable SHA-tagged artifacts and tag for staging stack
        run: |
          REPO_LC="${{ steps.repo_meta.outputs.repo_lc }}"
          echo "Pulling immutable API image: ghcr.io/${REPO_LC}/api:${{ github.sha }}"
          docker pull "ghcr.io/${REPO_LC}/api:${{ github.sha }}"
          docker tag "ghcr.io/${REPO_LC}/api:${{ github.sha }}" vlxd-api:staging

          echo "Pulling immutable Web image: ghcr.io/${REPO_LC}/web:${{ github.sha }}"
          docker pull "ghcr.io/${REPO_LC}/web:${{ github.sha }}"
          docker tag "ghcr.io/${REPO_LC}/web:${{ github.sha }}" vlxd-web:staging

      - name: Boot Staging Deployment Stack
        run: docker compose -f compose.staging.yml up -d --no-build --wait

      - name: Run Automated Post-Deploy Smoke Tests
        env:
          API_URL: "http://localhost:3001"
          WEB_URL: "http://localhost:3000"
          SMOKE_MAX_ATTEMPTS: ${{ github.event.inputs.smoke_max_attempts || '15' }}
          SMOKE_RETRY_DELAY_MS: "1500"
        run: node scripts/smoke-test.mjs

      - name: Capture Diagnostic Logs on Failure
        if: failure()
        run: |
          echo "=== STAGING DEPLOYMENT FAILED: DIAGNOSTIC CONTAINER LOGS ==="
          docker compose -f compose.staging.yml logs

      - name: Execute Automated Rollback on Smoke Failure
        if: failure()
        env:
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
          REPO_LC: ${{ steps.repo_meta.outputs.repo_lc }}
        run: |
          echo "⚠️ Smoke tests failed for revision ${{ github.sha }}."
          echo "Initiating automated rollback sequence..."

          # Validate ROLLBACK_SHA format safely to prevent command injection
          if [[ -n "$ROLLBACK_SHA" && "$ROLLBACK_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Rolling back to specified immutable commit SHA: ${ROLLBACK_SHA}"
            TARGET_API_TAG="ghcr.io/${REPO_LC}/api:${ROLLBACK_SHA}"
            TARGET_WEB_TAG="ghcr.io/${REPO_LC}/web:${ROLLBACK_SHA}"
          else
            echo "Rolling back to previous staging release tag (:staging-previous or :staging)..."
            TARGET_API_TAG="ghcr.io/${REPO_LC}/api:staging"
            TARGET_WEB_TAG="ghcr.io/${REPO_LC}/web:staging"
          fi

          docker pull "$TARGET_API_TAG" && docker tag "$TARGET_API_TAG" vlxd-api:staging || true
          docker pull "$TARGET_WEB_TAG" && docker tag "$TARGET_WEB_TAG" vlxd-web:staging || true
          docker compose -f compose.staging.yml up -d --no-build --wait || true
          echo "Rollback restoration applied."

      - name: Tag Current Deployment as Previous Staging for Next Rollback
        if: success()
        run: |
          REPO_LC="${{ steps.repo_meta.outputs.repo_lc }}"
          docker tag "ghcr.io/${REPO_LC}/api:${{ github.sha }}" "ghcr.io/${REPO_LC}/api:staging-previous" || true
          docker tag "ghcr.io/${REPO_LC}/web:${{ github.sha }}" "ghcr.io/${REPO_LC}/web:staging-previous" || true
          echo "✅ Staging deployment of revision ${{ github.sha }} verified successfully."
