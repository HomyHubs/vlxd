name: Staging Smoke Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      smoke_max_attempts:
        description: "Maximum smoke test retry attempts"
        required: false
        default: "15"

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-deploy-check:
    name: Pre-Deploy Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Prettier formatting
        run: pnpm run format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build applications and packages
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  deploy-staging:
    name: Staging Container Build, Deploy & Smoke Test
    runs-on: ubuntu-latest
    needs: [pre-deploy-check]
    timeout-minutes: 15
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 for smoke testing
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and boot staging Docker Compose stack
        run: docker compose -f compose.staging.yml up -d --build --wait

      - name: Run automated smoke tests
        env:
          API_URL: "http://localhost:3001"
          WEB_URL: "http://localhost:3000"
          SMOKE_MAX_ATTEMPTS: ${{ github.event.inputs.smoke_max_attempts || '15' }}
          SMOKE_RETRY_DELAY_MS: "1500"
        run: node scripts/smoke-test.mjs

      - name: Capture Container Logs on Failure
        if: failure()
        run: |
          echo "=== API Container Logs ==="
          docker compose -f compose.staging.yml logs api
          echo "=== Web Container Logs ==="
          docker compose -f compose.staging.yml logs web

      - name: Teardown Staging Stack
        if: always()
        run: docker compose -f compose.staging.yml down --volumes --remove-orphans
